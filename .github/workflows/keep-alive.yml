name: Keep Streamlit Apps Alive

on:
  schedule:
    - cron: '0 23 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping 기록지해방 (Streamlit)
        run: |
          echo "🔔 기록지해방 앱 깨우는 중..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "https://jukgan-jaripdong-app-93jqyjotebw9s6ykzzncff.streamlit.app/")
          echo "기록지해방 응답: $STATUS"

      - name: Ping 계획서해방2 (Streamlit)
        run: |
          echo "🔔 계획서해방2 앱 깨우는 중..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "https://m83g448p3tjqw9tz9nszle.streamlit.app/")
          echo "계획서해방2 응답: $STATUS"

      - name: 결과 요약
        run: echo "✅ Streamlit 앱 keep-alive 완료 ($(date '+%Y-%m-%d %H:%M UTC'))"
