<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50">
<div id="app">
  <div class="flex flex-col items-center justify-center min-h-screen bg-white gap-6">
    <img src="/images/logo_home.jpg" alt="복지인 서류해방" class="w-64 drop-shadow-md">
    <div class="flex gap-3">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
    <p class="text-sm text-indigo-400 tracking-wide">잠시만 기다려 주세요...</p>
  </div>
</div>
<script>
let state = {
  user: null,
  users: [],
  logs: [],
  loading: false,
  tab: 'dashboard',
  page: 'landing',  // 'landing' | 'login' | 'app'
  dataLoaded: false,
  logFilter: { startDate: '', endDate: '', userId: '', organization: '' },
  userFilter: { search: '', organization: '' },
  selectedLogs: [],
  editingUser: null,
  appConfig: null,
  aiModel: 'haiku',
  plans: [],
  adminStats: null
};

let authToken = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || null;

const api = async (action, body = null) => {
  const headers = { 'Content-Type': 'application/json' };
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
  const res = await fetch(`/api/db?action=${action}`, {
    method: body ? 'POST' : 'GET',
    headers,
    body: body ? JSON.stringify(body) : null
  });
  return res.json();
};

const loadData = async () => {
  try {
    const [users, logs, cfg, settings, plans] = await Promise.all([
      api('getUsers'),
      api('getLogs'),
      fetch('/api/getAppConfig').then(r => r.json()).catch(() => ({})),
      api('getSettings').catch(() => []),
      api('getPlans').catch(() => [])
    ]);
    state.users = users;
    state.logs = logs;
    state.appConfig = cfg;
    state.plans = plans || [];
    // 포트원 설정 로드
    if (cfg.portone) {
      PORTONE_STORE_ID = cfg.portone.storeId || '';
      PORTONE_CHANNEL_KEY = cfg.portone.channelKey || '';
    }
    // 카카오 SDK 초기화
    if (cfg.kakaoJsKey && window.Kakao && !Kakao.isInitialized()) {
      Kakao.init(cfg.kakaoJsKey);
    }
    const aiModelSetting = settings.find(s => s.key === 'ai_model');
    if (aiModelSetting) state.aiModel = aiModelSetting.value;
    state.dataLoaded = true;
  } catch (e) { console.error(e); state.users = []; state.logs = []; state.dataLoaded = true; }
  // render()는 외부(스플래시 타이머)에서 호출
};

const ensureAdminStats = async () => {
  if (!state.adminStats) {
    try { state.adminStats = await api('getAdminStats'); } catch(e) { state.adminStats = { subscriptions: [], payments: [] }; }
  }
};

// 허브 서브앱 식별자 매핑 (백엔드 ALLOWED_APPS 와 일치해야 함)
const HUB_APP_MAP = {
  'https://jukgan-jaripdong-app-93jqyjotebw9s6ykzzncff.streamlit.app/': 'girokgi',
  'https://planner-app-dc5h.vercel.app': 'plan1',
  'https://m83g448p3tjqw9tz9nszle.streamlit.app/': 'plan2',
};

const openExtApp = async (url) => {
  const appKey = HUB_APP_MAP[url];

  // 허브 관리 대상 앱(JWT 인증 필요)
  if (appKey) {
    if (!authToken) {
      alert('로그인이 필요합니다.');
      return;
    }
    try {
      const resp = await fetch('/api/hub?action=issueToken', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${authToken}`,
        },
        body: JSON.stringify({ app: appKey }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        alert(data.error || '접근 토큰을 발급하지 못했습니다.');
        return;
      }
      // 토큰은 ?token=... 쿼리로 전달 (HTTPS로 암호화됨)
      // React/Streamlit 양쪽에서 읽을 수 있도록 query 사용, 수신 측에서 즉시 URL 정리
      const sep = url.includes('?') ? '&' : '?';
      window.open(`${url}${sep}token=${encodeURIComponent(data.token)}`, '_blank');
    } catch (err) {
      console.error('[openExtApp] issueToken failed', err);
      alert('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    }
    return;
  }

  // 허브 관리 대상이 아닌 외부 링크 (레거시 호환)
  const code = state.appConfig?.accessCode ?? '';
  window.open(url + '?ac=' + encodeURIComponent(code), '_blank');
};

// 로그 검색
const searchLogs = () => {
  state.logFilter.startDate = document.getElementById('filterStartDate').value;
  state.logFilter.endDate = document.getElementById('filterEndDate').value;
  state.logFilter.organization = document.getElementById('filterOrg').value;
  state.logFilter.userId = document.getElementById('filterUser').value;
  render();
};

// 로그 필터 초기화
const resetLogFilter = () => {
  state.logFilter = { startDate: '', endDate: '', userId: '', organization: '' };
  render();
};

// 제공인력 검색
const searchUsers = () => {
  state.userFilter.search = document.getElementById('userSearchInput').value;
  state.userFilter.organization = document.getElementById('userOrgFilter').value;
  render();
};

// 제공인력 필터 초기화
const resetUserFilter = () => {
  state.userFilter = { search: '', organization: '' };
  render();
};

const getGreeting = () => {
  const h = new Date().getHours(), n = state.user.name;
  if(h>=6&&h<12) return `좋은 아침이에요, ${n} 선생님 ☀️`;
  if(h>=12&&h<18) return `오늘도 힘내세요, ${n} 선생님 💪`;
  if(h>=18&&h<22) return `오늘 하루도 수고하셨어요, ${n} 선생님 🌙`;
  return `늦은 밤 고생이 많으세요, ${n} 선생님 🌜`;
};

const showExample = () => {
  const modal = document.createElement('div');
  modal.id = 'exampleModal';
  modal.innerHTML = `
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onclick="if(event.target===this)closeExample()">
      <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div class="p-7">
          <div class="flex justify-between items-center mb-5">
            <h3 class="text-xl font-bold">📝 작성 예시 & 옵션 안내</h3>
            <button onclick="closeExample()" class="text-gray-500 hover:text-gray-700 text-3xl leading-none">&times;</button>
          </div>
          <div class="space-y-6">

            <!-- 입력 예시 -->
            <div>
              <p class="text-base font-bold text-gray-800 mb-3">✍️ 이렇게 입력하세요</p>

                <p class="text-base font-semibold text-orange-700 mb-2">⚠️ 긍정·부정 행동이 섞인 예시 — 처리사항 체크 ✅</p>
                <p class="text-base text-gray-700 leading-loose">자신의 초상화를 이용한 폴리곤아트를 그려보는 시간을 가졌어. 이용자는 폴리곤 아트가 뭔지 몰라서 질문했고 마카펜으로 색칠을 했지만, 집중력이 오래가지 못하고 산만한 모습과 바지에 손을 넣는 비위생적인 모습을 보이기도 했어.</p>
                <p class="text-sm text-gray-500 mt-3">→ 평소 말하듯 편하게 작성하면 AI가 아래처럼 변환해드립니다.</p>
              </div>
            </div>

            <!-- 말투 스타일별 결과 비교 -->
            <div>
              <p class="text-base font-bold text-gray-800 mb-2">🎨 말투 스타일별 결과 비교</p>
              <p class="text-sm text-gray-500 mb-3">말투 스타일에 따라 이렇게 달라져요 · <span class="text-indigo-600 font-semibold">전문적 견해</span> + <span class="text-red-600 font-semibold">처리사항</span> 포함</p>
              <div class="space-y-4">

                <!-- 기본 -->
                <div class="bg-gray-50 border rounded-xl p-4">
                  <p class="text-sm font-bold text-indigo-600 mb-2">📌 기본 — 정형적이고 체계적인 문장</p>
                  <p class="text-sm text-gray-700 leading-loose">자신의 초상화를 활용한 폴리곤 아트 활동을 하는 시간을 가졌습니다. 이용자는 활동 시작 전 폴리곤 아트의 개념에 대해 질문하였으며 마카펜으로 색칠에 참여하였으나, 활동 중 집중력이 저하되어 산만한 모습과 바지에 손을 넣는 비위생적인 행동이 관찰되었습니다. <span class="text-indigo-700 font-medium">새로운 표현 활동에 대한 탐구적 태도를 보였으나, 지속적인 집중 지원이 필요한 것으로 판단됩니다.</span></p>

  window.addEventListener('scroll', lpNavHandler);

  // ── 스크롤 REVEAL ──
  const lpObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.12 });
  document.querySelectorAll('.lp-reveal').forEach(el => lpObserver.observe(el));

  // ── 후기 캐러셀 ──
  let lpSlideIdx = 0;
  let lpSlideTimer;
  const LP_TOTAL = 2;
  window.lpGoSlide = (idx) => {
    lpSlideIdx = ((idx % LP_TOTAL) + LP_TOTAL) % LP_TOTAL;
    const track = document.getElementById('lp-testimonial-track');
    if (track) track.style.transform = `translateX(-${lpSlideIdx * 100}%)`;
    document.querySelectorAll('.lp-carousel-dot').forEach((d, i) => d.classList.toggle('active', i === lpSlideIdx));
    clearInterval(lpSlideTimer);
    lpSlideTimer = setInterval(() => window.lpGoSlide(lpSlideIdx + 1), 9000);
  };
  lpSlideTimer = setInterval(() => window.lpGoSlide(lpSlideIdx + 1), 9000);
  // 터치 스와이프
  const lpCarousel = document.querySelector('.lp-carousel-wrap');
  if (lpCarousel) {
    let _sx = 0;
    lpCarousel.addEventListener('touchstart', e => { _sx = e.touches[0].clientX; }, {passive:true});
    lpCarousel.addEventListener('touchend', e => {
      const diff = _sx - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) window.lpGoSlide(lpSlideIdx + (diff > 0 ? 1 : -1));
    }, {passive:true});
  }

  // ── 히어로 이미지 슬라이드쇼 ──
  const LP_HERO_TOTAL = 4;
  let lpHeroIdx = 0;
  let lpHeroTimer;
  const lpHeroSlides = () => document.querySelectorAll('.lp-hero-slide');
  const lpHeroDots = () => document.querySelectorAll('#lp-hero-dots .lp-slider-dot');
  const lpHeroTabs = () => document.querySelectorAll('#lp-section-tabs .lp-section-tab');
  window.lpHeroGo = (idx) => {
    lpHeroIdx = ((idx % LP_HERO_TOTAL) + LP_HERO_TOTAL) % LP_HERO_TOTAL;
    lpHeroSlides().forEach((s, i) => s.classList.toggle('is-active', i === lpHeroIdx));
    lpHeroDots().forEach((d, i) => d.classList.toggle('is-active', i === lpHeroIdx));
    lpHeroTabs().forEach((t, i) => t.classList.toggle('is-active', i === lpHeroIdx));
    clearInterval(lpHeroTimer);
    lpHeroTimer = setInterval(() => window.lpHeroGo(lpHeroIdx + 1), 5000);
  };
  window.lpHeroNext = () => window.lpHeroGo(lpHeroIdx + 1);
  window.lpHeroPrev = () => window.lpHeroGo(lpHeroIdx - 1);
  if (lpHeroSlides().length) {
    lpHeroTimer = setInterval(() => window.lpHeroGo(lpHeroIdx + 1), 5000);
    // 터치 스와이프

const requestPasswordReset = async () => {
  const email = document.getElementById('forgotPwEmail')?.value?.trim();
  const errEl = document.getElementById('forgotPwErr');
  const successEl = document.getElementById('forgotPwSuccess');
  const btn = document.getElementById('forgotPwBtn');

  errEl.classList.add('hidden');
  successEl.classList.add('hidden');

  if (!email) {
    errEl.textContent = '이메일 또는 아이디를 입력해주세요.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = '전송 중...';

  try {
    const res = await fetch('/api/auth?action=requestPasswordReset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.error;
      errEl.classList.remove('hidden');
    } else {
      successEl.textContent = data.message;
      successEl.classList.remove('hidden');
      btn.style.display = 'none';
    }
  } catch (e) {
    errEl.textContent = '서버 연결에 실패했습니다.';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = '비밀번호 재설정 이메일 보내기';
  }
};

const executePasswordReset = async () => {
  const newPassword = document.getElementById('newPassword')?.value;
  const confirmPassword = document.getElementById('confirmPassword')?.value;
  const errEl = document.getElementById('resetPwErr');
  const successEl = document.getElementById('resetPwSuccess');
  const btn = document.getElementById('resetPwBtn');

  errEl.classList.add('hidden');
  successEl.classList.add('hidden');

  if (!newPassword || newPassword.length < 4) {
    errEl.textContent = '비밀번호는 4자 이상이어야 합니다.';
    errEl.classList.remove('hidden');
    return;
  }
  if (newPassword !== confirmPassword) {
    errEl.textContent = '비밀번호가 일치하지 않습니다.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = '변경 중...';

  try {
    const res = await fetch('/api/auth?action=resetPassword', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: _resetToken, newPassword })
    });
    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.error;
      errEl.classList.remove('hidden');
    } else {
      successEl.textContent = data.message;
      successEl.classList.remove('hidden');
      btn.style.display = 'none';
      // 3초 후 로그인 페이지로 이동
      setTimeout(() => {
        _resetToken = null;
        state.page = 'login';
        history.replaceState(null, '', '/');
        render();
      }, 3000);
    }
  } catch (e) {
    errEl.textContent = '서버 연결에 실패했습니다.';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = '비밀번호 변경';
  }
};

const updateProfile = async () => {
  const name = document.getElementById('profileName').value.trim();
  const email = document.getElementById('profileEmail').value.trim();
  const phone = document.getElementById('profilePhone').value.trim();
  const organization = document.getElementById('profileOrg').value.trim();

  if (!name) { showMsg('이름은 필수입니다.'); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg('올바른 이메일 형식이 아닙니다.'); return;
  }

  try {
    const response = await fetch('/api/db?action=updateProfile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
      body: JSON.stringify({ name, email, phone, organization })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);

    state.user.name = name;
    state.user.email = email;
    state.user.phone = phone;
    state.user.organization = organization;

    showMsg('개인정보가 수정되었습니다.', 'success');
  } catch (error) {
    showMsg('수정 실패: ' + (error.message || '오류가 발생했습니다.'));
  }
};

const changePassword = async () => {
  const currentPassword = document.getElementById('currentPw').value;
  const newPassword = document.getElementById('newPw').value;
  const confirmPassword = document.getElementById('confirmPw').value;

  if (!currentPassword || !newPassword) {
    showMsg('현재 비밀번호와 새 비밀번호를 입력해주세요.'); return;
  }
  if (newPassword.length < 4) {
    showMsg('새 비밀번호는 4자 이상이어야 합니다.'); return;
  }
  if (newPassword !== confirmPassword) {
    showMsg('새 비밀번호가 일치하지 않습니다.'); return;
  }

  try {
    const response = await fetch('/api/db?action=updateProfile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
      body: JSON.stringify({ currentPassword, newPassword })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);

    showMsg('비밀번호가 변경되었습니다.', 'success');
    document.getElementById('currentPw').value = '';
    document.getElementById('newPw').value = '';

    showMsg('비밀번호 변경 실패: ' + (error.message || '오류가 발생했습니다.'));

};

const getStats = () => {
  const today = new Date().toLocaleDateString('ko-KR');
  const users = state.users.filter(u => u.role === 'user');
  const todayLogs = state.logs.filter(l => l.date === today);
  const todayUsers = [...new Set(todayLogs.map(l => l.user_id))];

  const now = new Date(); now.setHours(0,0,0,0);
  let activeCount = 0, trialCount = 0, expiredCount = 0;
  users.forEach(u => {
    if (!u.subscription_end) { expiredCount++; return; }
    const end = new Date(u.subscription_end);
    if (end < now) expiredCount++;
    else activeCount++;
  });

  const payments = state.adminStats?.payments || [];
  const thisMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const monthlyRevenue = payments.filter(p => p.status === 'paid' && p.paid_at?.startsWith(thisMonth)).reduce((s, p) => s + (p.amount || 0), 0);
  const totalRevenue = payments.filter(p => p.status === 'paid').reduce((s, p) => s + (p.amount || 0), 0);

  return { totalUsers: users.length, todayActiveUsers: todayUsers.length, todayConversions: todayLogs.length, activeCount, trialCount, expiredCount, monthlyRevenue, totalRevenue };
};

const getFilteredLogs = () => {
  let logs = [...state.logs];
  
  // 시작 날짜 필터
  if (state.logFilter.startDate) {
    logs = logs.filter(l => {
      const parts = l.date.split('. ').map(p => parseInt(p));
      if (parts.length >= 3) {
        const logDate = new Date(parts[0], parts[1] - 1, parts[2]);
        const startDate = new Date(state.logFilter.startDate);
        startDate.setHours(0, 0, 0, 0);
        return logDate >= startDate;
      }
      return true;
    });
  }
  
  // 끝 날짜 필터
  if (state.logFilter.endDate) {
    logs = logs.filter(l => {
      const parts = l.date.split('. ').map(p => parseInt(p));
      if (parts.length >= 3) {
        const logDate = new Date(parts[0], parts[1] - 1, parts[2]);
        const endDate = new Date(state.logFilter.endDate);
        endDate.setHours(23, 59, 59, 999);
        return logDate <= endDate;
      }
      return true;
    });
  }
  
  // 제공인력 필터
  if (state.logFilter.userId) {
    logs = logs.filter(l => l.user_id === state.logFilter.userId);
  }
  
  // 소속기관 필터
  if (state.logFilter.organization) {
    const usersInOrg = state.users.filter(u => u.organization === state.logFilter.organization).map(u => u.id);
    logs = logs.filter(l => usersInOrg.includes(l.user_id));
  }
  
  return logs;
};

const getFilteredUsers = () => {
  let users = [...state.users];
  
  // 검색어 필터 (이름 또는 아이디)
  if (state.userFilter.search) {
    const search = state.userFilter.search.toLowerCase();
    users = users.filter(u => 
      u.name.toLowerCase().includes(search) || 
      u.id.toLowerCase().includes(search)
    );
  }
  
  // 소속기관 필터
  if (state.userFilter.organization) {
    users = users.filter(u => u.organization === state.userFilter.organization);
  }
  
  return users;
};

const getSubLabel = (u) => {
  // adminStats에서 실제 구독 상태 조회
  const subs = state.adminStats?.subscriptions || [];
  const userSubs = subs.filter(s => s.user_id === u.id);
  // active/trial 구독을 우선 선택, 없으면 최신 레코드
  const activeSub = userSubs.filter(s => s.status === 'active' || s.status === 'trial')
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
  const userSub = activeSub || userSubs
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

  if (userSub) {
    // subscriptions.end_date와 users.subscription_end 중 더 먼 미래 날짜 사용
    const subEnd = userSub.end_date ? new Date(userSub.end_date) : null;
    const userEnd = u.subscription_end ? new Date(u.subscription_end) : null;
    const end = (subEnd && userEnd) ? (subEnd > userEnd ? subEnd : userEnd) : (subEnd || userEnd);
    const days = end ? Math.ceil((end - new Date()) / 86400000) : 0;
    const statusMap = {
      'active': { text: '구독중', cls: 'bg-green-100 text-green-700' },
      'trial': { text: '체험중', cls: 'bg-blue-100 text-blue-700' },
      'cancelled': { text: '해지', cls: 'bg-gray-100 text-gray-600' },
      'expired': { text: '만료', cls: 'bg-red-100 text-red-700' },
      'past_due': { text: '연체', cls: 'bg-orange-100 text-orange-700' },
    };
    // status가 expired/cancelled이더라도 end_date가 미래면 구독중으로 표시
    if ((userSub.status === 'expired' || userSub.status === 'cancelled') && end && days > 0) {
      if (days <= 3) return { text: '구독중 D-' + days, cls: 'bg-amber-100 text-amber-700' };
      return { text: '구독중', cls: 'bg-green-100 text-green-700' };
    }
    const label = statusMap[userSub.status] || { text: userSub.status, cls: 'bg-gray-100 text-gray-600' };
    if ((userSub.status === 'active' || userSub.status === 'trial') && days > 0 && days <= 3) {
      return { text: `${label.text} D-${days}`, cls: 'bg-amber-100 text-amber-700' };
    }
    if ((userSub.status === 'active' || userSub.status === 'trial') && end && days <= 0) {
      return { text: '만료', cls: 'bg-red-100 text-red-700' };
    }
    return label;
  }

  // subscriptions 데이터 없으면 subscription_end로 폴백
  if (!u.subscription_end) return { text: '미구독', cls: 'bg-gray-100 text-gray-600' };
  const end = new Date(u.subscription_end);
  const days = Math.ceil((end - new Date()) / 86400000);
  if (days <= 0) return { text: '만료', cls: 'bg-red-100 text-red-700' };
  if (days <= 3) return { text: 'D-' + days, cls: 'bg-amber-100 text-amber-700' };
  return { text: '구독중', cls: 'bg-green-100 text-green-700' };
};

const exportUsersCsv = () => {
  const users = state.users.filter(u => u.role === 'user');
  const header = '이름,아이디,소속기관,이메일,전화번호,구독만료일';
  const rows = users.map(u => `"${u.name}","${u.id}","${u.organization || ''}","${u.email || ''}","${u.phone || ''}","${u.subscription_end || ''}"`);
  const csv = '\uFEFF' + header + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'users_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
};

const closePlanModal = () => {
  const modal = document.getElementById('planModal');
  if (modal) modal.remove();
};

const savePlan = async (isEdit) => {
  const id = document.getElementById('planModalId').value.trim();
  const name = document.getElementById('planModalName').value.trim();
  const price = parseInt(document.getElementById('planModalPrice').value);
  const interval = document.getElementById('planModalInterval').value;
  const description = document.getElementById('planModalDesc').value.trim();
  const is_popular = document.getElementById('planModalPopular').checked;
  const is_active = document.getElementById('planModalActive').checked;

  if (!id || !name || !price) return showMsg('ID, 상품명, 가격은 필수입니다.');

  const data = { id, name, price, interval, description, is_popular, is_active };

  try {
    if (isEdit) {
      await api('updatePlan', data);
      const idx = state.plans.findIndex(p => p.id === id);
      if (idx >= 0) state.plans[idx] = { ...state.plans[idx], ...data };
    } else {
      await api('addPlan', data);
      state.plans.push(data);
    }
    closePlanModal();
    render();
  } catch (e) {
    showMsg('저장 실패: ' + e.message);
  }
};

const togglePlanField = async (planId, field, value) => {
  try {
    await api('updatePlan', { id: planId, [field]: value });
    const plan = state.plans.find(p => p.id === planId);
    if (plan) plan[field] = value;
    render();
  } catch (e) {
    showMsg('변경 실패: ' + e.message);
  }
};

const deletePlan = async (planId) => {
  if (!confirm(`'${planId}' 상품을 삭제하시겠습니까?`)) return;
  try {
    await api('deletePlan', { id: planId });
    state.plans = state.plans.filter(p => p.id !== planId);
    render();
  } catch (e) {
    showMsg('삭제 실패: ' + e.message);
  }
};

// 결제 전 필수 정보(이메일/전화번호) 수집 모달
// serverError: 서버 저장 실패 시 모달 내 에러 표시용
const showRequiredInfoModal = ({ needEmail, needPhone, serverError = null }) => {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.onclick = (e) => { if (e.target === modal) { modal.remove(); resolve(null); } };
    modal.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:32px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
        <h2 style="font-size:18px;font-weight:700;color:#1f2937;margin-bottom:8px;">📋 결제 전 필수 정보 입력</h2>
        <p style="font-size:14px;color:#6b7280;margin-bottom:${serverError ? '10px' : '20px'};">결제를 진행하기 위해 아래 정보를 입력해 주세요.</p>
        ${serverError ? `<p style="background:#fef2f2;color:#dc2626;font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;">⚠️ ${serverError}</p>` : ''}
        ${needEmail ? `
          <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:4px;">이메일 *</label>
          <input id="reqEmail" type="email" inputmode="email"
            style="width:100%;padding:12px 16px;border:1px solid #d1d5db;border-radius:12px;font-size:15px;outline:none;box-sizing:border-box;"
            placeholder="example@email.com">
          <p id="reqEmailError" style="color:#dc2626;font-size:13px;margin-top:4px;display:none;"></p>
        ` : ''}
        ${needPhone ? `
          <label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-top:${needEmail ? '14px' : '0'};margin-bottom:4px;">전화번호 *</label>
          <input id="reqPhone" type="tel" inputmode="numeric"
            style="width:100%;padding:12px 16px;border:1px solid #d1d5db;border-radius:12px;font-size:15px;outline:none;box-sizing:border-box;"
            placeholder="숫자만 입력 (예: 01012345678)">
          <p id="reqPhoneError" style="color:#dc2626;font-size:13px;margin-top:4px;display:none;"></p>
        ` : ''}
        <div style="display:flex;gap:8px;margin-top:20px;">
          <button id="reqCancel" style="flex:1;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:14px;font-weight:600;background:#fff;cursor:pointer;">취소</button>
          <button id="reqSubmit" style="flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:600;background:#4f46e5;color:#fff;cursor:pointer;">확인</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    const emailInput = needEmail ? document.getElementById('reqEmail') : null;
    const phoneInput = needPhone ? document.getElementById('reqPhone') : null;
    const emailError = needEmail ? document.getElementById('reqEmailError') : null;
    const phoneError = needPhone ? document.getElementById('reqPhoneError') : null;

    if (emailInput) emailInput.focus();
    else if (phoneInput) phoneInput.focus();

    if (phoneInput) {
      phoneInput.addEventListener('input', () => {
        phoneInput.value = phoneInput.value.replace(/[^0-9]/g, '');
        if (phoneError) phoneError.style.display = 'none';
      });
    }
    if (emailInput) {
      emailInput.addEventListener('input', () => {
        if (emailError) emailError.style.display = 'none';
      });
    }

    document.getElementById('reqCancel').onclick = () => { modal.remove(); resolve(null); };
    document.getElementById('reqSubmit').onclick = () => {
      const result = {};
      if (needEmail) {
        const email = emailInput.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailError.textContent = '올바른 이메일 주소를 입력해주세요.';
          emailError.style.display = 'block';
          emailInput.focus();
          return;
        }
        result.email = email;
      }
      if (needPhone) {
        const phone = phoneInput.value.trim().replace(/[^0-9]/g, '');
        if (!/^01[016789]\d{7,8}$/.test(phone)) {
          phoneError.textContent = '올바른 휴대폰 번호를 입력해주세요. (예: 01012345678)';
          phoneError.style.display = 'block';
          phoneInput.focus();
          return;
        }
        result.phone = phone;
      }
      modal.remove();
      resolve(result);
    };

    const lastInput = phoneInput || emailInput;
    if (lastInput) {
      lastInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('reqSubmit').click();
      });
    }
  });
};

const startPayment = async (planType) => {
  if (!state.user) {
    showMsg('로그인이 필요합니다.');
    return;
  }

  if (!window.PortOne) {
    showMsg('결제 모듈을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  if (!PORTONE_STORE_ID || !PORTONE_CHANNEL_KEY) {
    showMsg('결제 설정이 완료되지 않았습니다.\n카카오톡 고객센터로 문의해 주세요.');
    console.error('PortOne config missing: storeId=', PORTONE_STORE_ID, 'channelKey=', PORTONE_CHANNEL_KEY);
    return;
  }

  const plan = getPlanInfo(planType);
  if (!plan) {
    showMsg('유효하지 않은 요금제입니다.');
    return;
  }

  // 결제 필수 정보 확인: 이메일·전화번호 없으면 통합 모달로 수집 (저장 실패 시 재입력)
  let needEmail = !state.user.email;
  let needPhone = !state.user.phone;

  if (needEmail || needPhone) {
    let serverError = null;
    while (true) {
      const result = await showRequiredInfoModal({ needEmail, needPhone, serverError });
      if (!result) return; // 취소 시 결제 중단

      try {
        const saveRes = await fetch('/api/db?action=updateProfile', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`,
          },
          body: JSON.stringify(result),
        });

        const saveData = await saveRes.json().catch(() => ({}));
        if (!saveRes.ok) {
          serverError = saveData.error || '정보 저장에 실패했습니다. 다시 시도해주세요.';
          continue; // 모달 다시 열기
        }

        if (result.email) state.user.email = result.email;
        if (result.phone) state.user.phone = result.phone;
        break; // 저장 성공 시 루프 종료
      } catch (err) {
        console.error('Required info save error:', err);
        serverError = '서버 연결 중 오류가 발생했습니다. 다시 시도해주세요.';
      }
    }
  }

  const btn = document.getElementById(`btn-${planType}`);
  if (btn) {
    btn.disabled = true;
    btn.textContent = '결제 처리 중...';
  }

  try {
    // 고유한 paymentId 생성 (KG이니시스 V2: ASCII만 허용)
    const paymentId = `pay-${Date.now()}-${Math.random().toString(36).substring(2, 10)}`;

    // 포트원 V2 SDK: 단건 결제 요청
    const paymentResponse = await PortOne.requestPayment({
      storeId: PORTONE_STORE_ID,
      channelKey: PORTONE_CHANNEL_KEY,
      paymentId: paymentId,
      orderName: `복서방 ${plan.name}`,
      totalAmount: plan.price,
      currency: 'CURRENCY_KRW',
      payMethod: 'CARD',
      customer: {
        customerId: state.user.id,
        fullName: state.user.name,
        email: state.user.email || undefined,
        phoneNumber: state.user.phone || undefined,
      },
    });

    // 사용자가 결제창을 닫은 경우
    if (paymentResponse.code != null) {
      console.log('결제 취소/실패:', paymentResponse.code, paymentResponse.message);
      const isCancelled = paymentResponse.code === 'USER_CANCEL' ||
        (paymentResponse.message || '').includes('취소');
      if (!isCancelled) {
        showMsg(`결제 오류: ${paymentResponse.message || '알 수 없는 오류'}`);
      }
      // 사용자 취소 - 조용히 처리
      return;
    }

    // 결제 성공 → 서버에서 검증 + 구독 활성화
    const response = await fetch('/api/payment?action=verify', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`,
      },
      body: JSON.stringify({ paymentId, planType }),
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || '결제 처리 중 오류가 발생했습니다.');
    }

    // 구독 정보 업데이트
    state.user.subscription_end = result.subscription_end;

    // 성공 모달 표시
    showPaymentSuccessModal(plan.name, result.amount, result.subscription_end);

  } catch (error) {
    console.error('결제 오류:', error);
    showMsg(`결제 처리 중 오류가 발생했습니다.\n${error.message}`);
  } finally {
    // 버튼 복원
    if (btn) {
      btn.disabled = false;
      btn.textContent = '💳 ' + (plan ? plan.name : planType) + ' 시작';
    }
  }
};

      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`,
      },
    });

    const result = await response.json();
    if (!response.ok) throw new Error(result.error);

    showMsg(`구독이 해지되었습니다.\n${result.subscription_end}까지 서비스를 이용하실 수 있습니다.`, 'info');
    renderSubscription();

    showMsg(`구독 해지 중 오류: ${error.message}`);

};

const getSubscriptionDaysLeft = (user) => {
  if (!user || !user.subscription_end) return null;
  const expire = new Date(user.subscription_end);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  expire.setHours(0, 0, 0, 0);
  return Math.ceil((expire - today) / (1000 * 60 * 60 * 24));
};

const continueWithEmail = async () => {

  const errEl = document.getElementById('authErr');
  const btn = document.getElementById('authBtn');

  if (!email || !pw) { errEl.textContent = '이메일(또는 아이디)과 비밀번호를 입력해주세요.'; errEl.classList.remove('hidden'); return; }
  if (!isValidEmail(email) && email.includes(' ')) {
    errEl.textContent = '아이디에 공백은 사용할 수 없습니다.';
    errEl.classList.remove('hidden'); return;
  }

  errEl.classList.add('hidden');

  // 회원가입 모드 → register 호출
  if (isRegisterMode) {
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim().replace(/-/g, '');
    const org = document.getElementById('regOrg').value.trim();

    if (!name || !phone) {
      errEl.textContent = '이름과 휴대폰 번호는 필수입니다.';
      errEl.classList.remove('hidden'); return;
    }
    if (!/^01[0-9]{8,9}$/.test(phone)) {
      errEl.textContent = '올바른 휴대폰 번호를 입력해주세요. (예: 01012345678)';
      errEl.classList.remove('hidden'); return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="inline-flex items-center gap-2"><svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>가입 중...</span>';

    try {
      const res = await fetch('/api/auth?action=register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: email, password: pw, name, email, phone, organization: org })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || '회원가입에 실패했습니다.'; errEl.classList.remove('hidden'); btn.disabled = false; btn.textContent = '회원가입 (10일 무료체험)'; return; }

      saveAuthToken(data.token);
      state.user = data.user;
      state.users.push(data.user);
      state.page = 'app';
      state.tab = 'hub';
      isRegisterMode = false;
      render();
    } catch (e) {
      console.error('Register error:', e);
      errEl.textContent = '서버 연결에 실패했습니다.';
      errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = '회원가입 (10일 무료체험)';
    }
    return;
  }

  // 로그인 모드 → continueWithEmail 호출
  btn.disabled = true;
  btn.innerHTML = '<span class="inline-flex items-center gap-2"><svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>확인 중...</span>';

  try {
    const res = await fetch('/api/auth?action=continueWithEmail', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });
    const data = await res.json();

    const resetBtn = () => { btn.disabled = false; btn.textContent = '계속하기'; btn.classList.remove('opacity-80'); };

    if (data.newUser) {
      // 신규 사용자 → 추가 필드 표시
      isRegisterMode = true;
      document.getElementById('regFields').classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = '회원가입 (10일 무료체험)';
      btn.classList.replace('bg-gray-800', 'bg-green-600');
      btn.classList.replace('hover:bg-gray-900', 'hover:bg-green-700');
      return;
    }

    if (!res.ok) {
      resetBtn();
      errEl.textContent = data.error || '로그인에 실패했습니다.';
      errEl.classList.remove('hidden');
      return;
    }

    // 로그인 성공
    saveAuthToken(data.token);
    state.user = data.user;
    state.page = 'app';
    if (data.subscription_expired) {
      state.tab = 'subscription';
      render();
      showMsg('이용 기간이 만료되었습니다.\n요금제를 선택하여 계속 이용하세요.', 'warning');
    } else {
      state.tab = 'hub';
      render();
    }

    const daysLeft = getSubscriptionDaysLeft(data.user);
    if (daysLeft !== null && daysLeft <= 3) {
      setTimeout(() => showSubscriptionAlert(daysLeft, data.user.subscription_end), 300);
    }
  } catch (e) {
    console.error('Login error:', e);
    btn.disabled = false; btn.textContent = '계속하기';
    errEl.textContent = '서버 연결에 실패했습니다.';
    errEl.classList.remove('hidden');
  }
};

let _socialLoginProvider = null;

const _showSocialLoading = (provider) => {

const _hideSocialLoading = () => {
  _socialLoginProvider = null;
  const container = document.getElementById('socialLoginBanner');
  if (container) container.innerHTML = '';
};

// 소셜 로그인 공통 - 백엔드 호출 후 로그인 처리
const _handleSocialLoginResult = async (provider, providerId, email, name) => {
  // 로그인 페이지를 렌더링한 뒤 배너 표시 (리다이렉트 복귀 시)
  _socialLoginProvider = provider;
  if (state.page !== 'login') {
    state.page = 'login';
    render();
  }
  _showSocialLoading(provider);
  try {
    const res = await fetch('/api/auth?action=socialLogin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider, providerId, email, name })
    });
    const data = await res.json();
    if (!res.ok) {
      _hideSocialLoading();
      if (res.status === 409) {
        showMsg(data.error || '이미 가입된 계정입니다. 기존 계정으로 로그인해주세요.');
      } else {
        showMsg(data.error || `${provider} 로그인에 실패했습니다.`);
      }
      return;
    }
    saveAuthToken(data.token);
    state.user = data.user;
    state.page = 'app';
    if (data.subscription_expired) {
      state.tab = 'subscription';
      _hideSocialLoading();
      render();
      showMsg('이용 기간이 만료되었습니다.\n요금제를 선택하여 계속 이용하세요.', 'warning');
    } else {
      state.tab = 'hub';
      _hideSocialLoading();
      render();
    }
  } catch (e) { _hideSocialLoading(); showMsg('서버 연결에 실패했습니다.'); }
};

// ====== 카카오 로그인 (팝업) ======
const loginWithKakao = () => {
  if (!window.Kakao || !Kakao.isInitialized()) {
    showMsg('카카오 로그인 준비 중입니다. 잠시 후 다시 시도해주세요.');
    return;
  }
  // window.open을 일시적으로 오버라이드하여 팝업 크기 강제 지정
  const originalOpen = window.open;
  window.open = function(url, name, features) {
    const w = 500, h = 600;
    const left = (screen.width - w) / 2;
    const top = (screen.height - h) / 2;
    const newFeatures = `width=${w},height=${h},left=${left},top=${top},scrollbars=yes,resizable=yes`;
    const result = originalOpen.call(window, url, name, newFeatures);
    window.open = originalOpen; // 즉시 원복
    return result;
  };

  Kakao.Auth.login({
    throughTalk: false, // 카카오톡 앱 연동 끄고 웹 팝업만 사용
    success: (authObj) => {
      Kakao.API.request({
        url: '/v2/user/me',
        success: async (kakaoUser) => {
          const email = kakaoUser.kakao_account?.email || null;
          const name = kakaoUser.kakao_account?.profile?.nickname || '사용자';
          const providerId = String(kakaoUser.id);
          await _handleSocialLoginResult('kakao', providerId, email, name);
        },
        fail: (err) => { console.error('Kakao user info error:', err); showMsg('카카오 사용자 정보를 가져올 수 없습니다.'); }
      });
    },
    fail: (err) => { console.error('Kakao login failed:', err); }
  });
};

// ====== 구글 로그인 (Google Identity Services - Token Client 팝업) ======
let _googleTokenClient = null;

const loginWithGoogle = () => {
  const clientId = state.appConfig?.googleClientId;
  if (!window.google?.accounts?.oauth2 || !clientId) {
    showMsg('구글 로그인 준비 중입니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  if (!_googleTokenClient) {
    _googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'openid email profile',
      callback: async (tokenResponse) => {
        if (tokenResponse.error) {
          console.error('Google OAuth error:', tokenResponse);
          showMsg('구글 로그인에 실패했습니다.');
          return;
        }
        try {
          const userRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
            headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
          });
          const userInfo = await userRes.json();
          await _handleSocialLoginResult('google', userInfo.sub, userInfo.email, userInfo.name);
        } catch (e) {
          console.error('Google login error:', e);
          showMsg('서버 연결에 실패했습니다.');
        }
      }
    });
  }

  // Google SDK가 자체적으로 팝업을 열어 계정 선택 화면 표시
  _googleTokenClient.requestAccessToken({ prompt: 'select_account' });
};

let lastActivity = '';
let lastNeedAction = false;
let lastTone = 'default';
let lastCharCount = '140';
let lastIncludeExpertView = true;

const getSelectedOptions = () => {
  const toneEl = document.querySelector('input[name="tone"]:checked');
  const charEl = document.querySelector('input[name="charCount"]:checked');
  const expertEl = document.getElementById('includeExpertView');
  const customEl = document.getElementById('customCharCount');

  const tone = toneEl ? toneEl.value : 'default';
  let charCount = charEl ? charEl.value : '140';
  if (charCount === 'custom') charCount = customEl ? customEl.value || '140' : '140';
  const includeExpertView = expertEl ? expertEl.checked : true;

  return { tone, charCount, includeExpertView };
};

const restoreOptions = () => {
  const toneEl = document.querySelector(`input[name="tone"][value="${lastTone}"]`);
  if (toneEl) toneEl.checked = true;

  const isCustom = !['120','140','160'].includes(lastCharCount);
  const charVal = isCustom ? 'custom' : lastCharCount;
  const charEl = document.querySelector(`input[name="charCount"][value="${charVal}"]`);
  if (charEl) charEl.checked = true;

  const customEl = document.getElementById('customCharCount');
  if (customEl) {
    if (isCustom) { customEl.classList.remove('hidden'); customEl.value = lastCharCount; }
    else { customEl.classList.add('hidden'); }
  }

  const expertEl = document.getElementById('includeExpertView');
  if (expertEl) expertEl.checked = lastIncludeExpertView;
};

const generate = async () => {
  const activity = document.getElementById('activity').value;
  const needAction = document.getElementById('needAction').checked;
  if(!activity) return showMsg('활동내용을 입력해주세요.');

  const todayUsage = getTodayUsageCount();
  if(todayUsage >= 7) {
    showMsg('😊 오늘 사용 가능한 횟수(7회)를 모두 사용하셨습니다.\n\n내일 다시 이용해 주시면 감사하겠습니다.\n선생님의 노고에 항상 감사드립니다! 🙏', 'warning');
    return;
  }

  const { tone, charCount, includeExpertView } = getSelectedOptions();
  lastActivity = activity;
  lastNeedAction = needAction;
  lastTone = tone;
  lastCharCount = charCount;
  lastIncludeExpertView = includeExpertView;
  state.loading = true;
  render();
  document.getElementById('activity').value = activity;
  document.getElementById('needAction').checked = needAction;
  restoreOptions();

  try {
    const genHeaders = {'Content-Type': 'application/json'};
    if (authToken) genHeaders['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: genHeaders,
      body: JSON.stringify({activity, needAction, model: state.aiModel, tone, charCount: parseInt(charCount), includeExpertView})
    });
    const data = await res.json();
    if(data.error) {
      showResult('⚠️ ' + data.error, '', '');
      state.loading = false;
      render();
      return;
    }
    
    let obs = data.result || '', act = '';
    if(data.result.includes('[관찰일지]') && data.result.includes('[처리사항]')) {
      obs = (data.result.match(/\[관찰일지\]\s*([\s\S]*?)\s*\[처리사항]/) || [])[1]?.trim() || '';
      act = (data.result.match(/\[처리사항\]\s*([\s\S]*)$/) || [])[1]?.trim() || '';
    } else if(data.result.includes('[관찰일지]')) {
      obs = data.result.replace('[관찰일지]', '').trim();
    }
    
    const logData = {
      id: Date.now(),
      date: new Date().toLocaleDateString('ko-KR'),
      time: new Date().toLocaleTimeString('ko-KR'),
      user_id: state.user.id,
      user_name: state.user.name,
      input: activity,
      observation: obs,
      action: act
    };
    await api('addLog', logData);
    state.logs.unshift(logData);
    showResult('', obs, act);
  } catch(e) {
    showResult('⚠️ 네트워크 오류: ' + e.message, '', '');
  }
  
  state.loading = false;
  render();
  document.getElementById('activity').value = lastActivity;
  document.getElementById('needAction').checked = lastNeedAction;
  restoreOptions();
};

const regenerate = () => {
  if(!lastActivity) return showMsg('이전 입력 내용이 없습니다.');
  document.getElementById('activity').value = lastActivity;
  document.getElementById('needAction').checked = lastNeedAction;
  restoreOptions();
  generate();
};

    if(!r) return;
    
    if(err) {
      r.innerHTML = `<div class="mt-6 bg-red-50 border-2 border-red-300 rounded-lg p-4 text-red-800">${err}</div>`;
      return;
    }
    
    // 결과를 전역 변수에 저장
    window.lastObservation = obs;
    window.lastAction = act;
    
    r.innerHTML = `
      <div class="mt-6 space-y-4">
        <div class="bg-white rounded-lg p-4 border-2 border-green-200">
          <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold">관찰일지</h3>

          </div>
          <div class="bg-gray-50 p-3 rounded border">${obs}</div>
        </div>
        ${act ? `
          <div class="bg-white rounded-lg p-4 border-2 border-orange-200">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold">처리사항</h3>
              <button onclick="copyAction(this)" class="px-3 py-1 bg-orange-100 text-orange-700 rounded text-sm">📋복사</button>
            </div>
            <div class="bg-gray-50 p-3 rounded border">${act}</div>

        <div class="flex justify-center pt-4">
          <button onclick="regenerate()" class="px-6 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-lg font-semibold">다시 작성하기</button>
        </div>
      </div>`;
  }, 100);
};

const updateUser = async() => {

// 사용량 초기화 (해당 사용자의 오늘 로그 삭제)
const resetUserUsage = async(userId, userName) => {
  if(confirm(`'${userName}' 선생님의 오늘 사용량을 초기화하시겠습니까?\n\n⚠️ 오늘 작성한 로그가 모두 삭제됩니다.`)) {
    const today = new Date().toLocaleDateString('ko-KR');
    const todayLogs = state.logs.filter(l => l.user_id === userId && l.date === today);
    const ids = todayLogs.map(l => l.id);
    
    if(ids.length > 0) {
      await api('deleteLogs', { ids });
      state.logs = state.logs.filter(l => !ids.includes(l.id));
    }
    
    showMsg(`${userName} 선생님의 오늘 사용량이 초기화되었습니다.`, 'success');
    render();
  }
};

const toggleLogSelect = (id) => {
  if(state.selectedLogs.includes(id)) {
    state.selectedLogs = state.selectedLogs.filter(l => l !== id);
  } else {
    state.selectedLogs.push(id);
  }
  render();
};

const deleteLog = async(id) => {
  if(confirm('이 로그를 삭제하시겠습니까?')) {
    await api('deleteLog', { id });
    state.logs = state.logs.filter(l => l.id !== id);
    render();
  }
};

const deleteSelectedLogs = async() => {
  if(confirm(`선택한 ${state.selectedLogs.length}개의 로그를 삭제하시겠습니까?`)) {
    await api('deleteLogs', { ids: state.selectedLogs });
    state.logs = state.logs.filter(l => !state.selectedLogs.includes(l.id));
    state.selectedLogs = [];
    render();
  }
};

// 날짜 형식 변환: 'YYYY. M. D.' (ko-KR) → Date 객체
const parseKoreanDate = (dateStr) => {
  if (!dateStr) return null;
  const cleaned = dateStr.replace(/\./g, '').replace(/\s+/g, ' ').trim();
  const parts = cleaned.split(/[\s\-\/]+/);
  if (parts.length >= 3) {
    return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  }
  return new Date(dateStr);
};

// 30일 이전 로그 삭제
const deleteOldLogs = async() => {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  cutoff.setHours(0, 0, 0, 0);

  // 한국어 날짜 형식('2026. 2. 9.')과 비교
  const oldLogs = state.logs.filter(l => {
    const logDate = parseKoreanDate(l.date);
    return logDate && logDate < cutoff;
  });

  if (oldLogs.length === 0) {
    showMsg('30일 이전 로그가 없습니다.');
    return;
  }

  const cutoffDisplay = `${cutoff.getFullYear()}. ${cutoff.getMonth()+1}. ${cutoff.getDate()}.`;
  if(confirm(`⚠️ 30일 이전 로그 삭제\n\n${cutoffDisplay} 이전에 작성된 로그 ${oldLogs.length}건을 삭제합니다.\n\n삭제된 로그는 복구할 수 없습니다.\n계속하시겠습니까?`)) {
    try {
      const oldIds = oldLogs.map(l => l.id);
      await api('deleteLogs', { ids: oldIds });
      state.logs = state.logs.filter(l => !oldIds.includes(l.id));
      state.selectedLogs = [];
      render();
      showMsg(`${oldLogs.length}건의 로그가 삭제되었습니다.`, 'success');
    } catch(e) {
      showMsg('삭제 중 오류가 발생했습니다: ' + e.message);
    }
  }
};

// 브랜드 카드 캐러셀 (수평 슬라이드)
let _brandInterval = null;
const startBrandSlider = () => {
  if(_brandInterval) clearInterval(_brandInterval);
  let cur = 0;
  const slides = document.querySelectorAll('.brand-slide');
  const dots = document.querySelectorAll('#brand-dots span');
  if(!slides.length) return;
  const updateDots = (idx) => {
    dots.forEach((d,i) => {
      d.className = i === idx
        ? 'w-2 h-2 rounded-full bg-indigo-400 transition-all duration-300'
        : 'w-2 h-2 rounded-full bg-gray-300 transition-all duration-300';
    });
  };
  _brandInterval = setInterval(() => {
    const next = (cur + 1) % slides.length;
    slides[cur].setAttribute('data-state','leaving');
    slides[next].setAttribute('data-state','entering');
    updateDots(next);
    setTimeout(() => {
      slides[cur].setAttribute('data-state','hidden');
      slides[next].setAttribute('data-state','visible');
    }, 500);
    cur = next;
  }, 3500);
};

// 글자수 라디오 변경 시 커스텀 입력 토글 (이벤트 위임)
document.addEventListener('change', e => {
  if (e.target.name === 'charCount') {
    const el = document.getElementById('customCharCount');
    if (el) el.classList.toggle('hidden', e.target.value !== 'custom');
  }
});

// 스플래시 화면 최소 1.8초 보장 후 로그인 화면 전환
const _splashStart = Date.now();

const restoreSession = async () => {
  if (!authToken) return;
  try {
    const res = await fetch('/api/auth?action=verify', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    if (res.ok) {
      const data = await res.json();
      state.user = data.user;
      state.page = 'app';
      state.tab = sessionStorage.getItem('lastTab') || 'hub';
    } else {
      authToken = null;
      sessionStorage.removeItem('authToken');
      localStorage.removeItem('authToken');
    }
  } catch {
    authToken = null;
    sessionStorage.removeItem('authToken');
    localStorage.removeItem('authToken');
  }
};

// 구글 OAuth 리다이렉트 감지 (모바일에서 팝업 대신 리다이렉트로 돌아올 때)
const _handleGoogleRedirect = async () => {
  const hash = window.location.hash;
  if (!hash || !hash.includes('access_token')) return false;
  _showSocialLoading('google');
  try {
    const params = new URLSearchParams(hash.substring(1));
    const accessToken = params.get('access_token');
    if (!accessToken) { _hideSocialLoading(); return false; }
    // URL 해시 정리
    history.replaceState(null, '', window.location.pathname);
    const userRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    const userInfo = await userRes.json();
    await _handleSocialLoginResult('google', userInfo.sub, userInfo.email, userInfo.name);
    return true;
  } catch (e) {
    console.error('Google redirect login error:', e);
    _hideSocialLoading();
    return false;
  }
};

loadData().then(() => restoreSession()).then(async () => {
  // OAuth 리다이렉트 처리 (구글)
  const handled = await _handleGoogleRedirect();
  if (handled) return; // 이미 로그인 처리 완료

  // 비밀번호 재설정 토큰 감지
  const urlParams = new URLSearchParams(window.location.search);
  const resetTokenParam = urlParams.get('resetToken');
  if (resetTokenParam) {
    _resetToken = resetTokenParam;
    state.page = 'resetPassword';
    history.replaceState(null, '', '/');
  }

  const elapsed = Date.now() - _splashStart;
  const minMs = 1800;
  setTimeout(render, Math.max(0, minMs - elapsed));
});
</script>
