<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일지 작성 도우미</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50">
<div id="app"><div class="flex items-center justify-center min-h-screen"><p>로딩 중...</p></div></div>
<script>
let state = { 
  user: null, 
  users: [], 
  logs: [], 
  loading: false, 
  tab: 'dashboard', 
  dataLoaded: false,
  logFilter: { startDate: '', endDate: '', userId: '', organization: '' },
  userFilter: { search: '', organization: '' },
  selectedLogs: [],
  editingUser: null
};

const api = async (action, body = null) => {
  const res = await fetch(`/api/db?action=${action}`, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : null
  });
  return res.json();
};

const loadData = async () => {
  try {
    state.users = await api('getUsers');
    state.logs = await api('getLogs');
    state.dataLoaded = true;
  } catch (e) { console.error(e); state.users = []; state.logs = []; state.dataLoaded = true; }
  render();
};

// 로그 검색
const searchLogs = () => {
  state.logFilter.startDate = document.getElementById('filterStartDate').value;
  state.logFilter.endDate = document.getElementById('filterEndDate').value;
  state.logFilter.organization = document.getElementById('filterOrg').value;
  state.logFilter.userId = document.getElementById('filterUser').value;
  render();
};

// 로그 필터 초기화
const resetLogFilter = () => {
  state.logFilter = { startDate: '', endDate: '', userId: '', organization: '' };
  render();
};

// 제공인력 검색
const searchUsers = () => {
  state.userFilter.search = document.getElementById('userSearchInput').value;
  state.userFilter.organization = document.getElementById('userOrgFilter').value;
  render();
};

// 제공인력 필터 초기화
const resetUserFilter = () => {
  state.userFilter = { search: '', organization: '' };
  render();
};

const getGreeting = () => {
  const h = new Date().getHours(), n = state.user.name;
  if(h>=6&&h<12) return `좋은 아침이에요, ${n} 선생님 ☀️`;
  if(h>=12&&h<18) return `오늘도 힘내세요, ${n} 선생님 💪`;
  if(h>=18&&h<22) return `오늘 하루도 수고하셨어요, ${n} 선생님 🌙`;
  return `늦은 밤 고생이 많으세요, ${n} 선생님 🌜`;
};

const showExample = () => {
  const modal = document.createElement('div');
  modal.id = 'exampleModal';
  modal.innerHTML = `
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onclick="if(event.target===this)closeExample()">
      <div class="bg-white rounded-2xl max-w-lg w-full max-h-[80vh] overflow-y-auto">
        <div class="p-6">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold">📝 작성 예시</h3>
            <button onclick="closeExample()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
          </div>
          <div class="space-y-4">
            <div class="bg-green-50 border border-green-200 rounded-lg p-4">
              <p class="text-sm font-semibold text-green-700 mb-2">✅ 예시 1: 긍정적인 활동</p>
              <p class="text-sm text-gray-700 leading-relaxed">비빔국수 요리수업을 했어. 이용자는 재료를 직접 썰고 양념장을 만들었어. 완성된 국수를 보며 "내가 만들었다!"라고 말하며 뿌듯한 표정을 지었어.</p>
              <p class="text-xs text-gray-500 mt-2">→ 처리사항 체크 ❌</p>
            </div>
            <div class="bg-orange-50 border border-orange-200 rounded-lg p-4">
              <p class="text-sm font-semibold text-orange-700 mb-2">⚠️ 예시 2: 부정적 행동 포함</p>
              <p class="text-sm text-gray-700 leading-relaxed">피구공 던지기 연습을 했어. 이용자는 던지기는 잘했지만 공을 잘 피하지 못했어. 자꾸 실수하자 혼잣말로 불만을 표현하며 짜증을 냈어.</p>
              <p class="text-xs text-gray-500 mt-2">→ 처리사항 체크 ✅</p>
            </div>
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
              <p class="text-sm text-blue-800">💡 <strong>팁:</strong> 평소 말하듯 편하게 작성하세요. AI가 전문적인 관찰일지로 변환해드립니다.</p>
            </div>
          </div>
          <button onclick="closeExample()" class="w-full mt-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold">확인</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
};

const closeExample = () => {
  const modal = document.getElementById('exampleModal');
  if(modal) modal.remove();
};

const getTodayUsageCount = (userId = null) => {
  const today = new Date().toLocaleDateString('ko-KR');
  const uid = userId || state.user.id;
  return state.logs.filter(l => l.user_id === uid && l.date === today).length;
};

const render = () => {
  if (!state.dataLoaded) return;
  const app = document.getElementById('app');
  if(!state.user) {
    app.innerHTML = `
      <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
          <div class="text-center mb-4">
            <span class="text-4xl">📝</span>
            <h1 class="text-2xl font-bold mt-2">일지 작성 도우미</h1>
            <p class="text-sm text-gray-500">감사합니다 주간활동센터</p>
          </div>
          <div class="text-center mb-6 py-3 bg-gradient-to-r from-indigo-50 via-purple-50 to-indigo-50 rounded-lg border border-indigo-100">
            <p class="text-sm font-medium text-indigo-600">"기록은 간편하게, 돌봄은 온전하게."</p>
            <p class="text-xs text-gray-500 mt-1">선생님들의 소중한 쉼과 더 나은 내일을 응원합니다.</p>
            <p class="text-xs text-gray-500 mt-1">🙏 하루 7회 이내 사용을 부탁드립니다.</p>
            <p class="text-xs text-indigo-400 mt-2">개발자: 천만석</p>
          </div>
          <div class="space-y-4">
            <div><label class="block text-sm font-medium mb-1">아이디</label><input id="loginId" class="w-full px-4 py-3 border rounded-lg"/></div>
            <div><label class="block text-sm font-medium mb-1">비밀번호</label><input id="loginPw" type="password" class="w-full px-4 py-3 border rounded-lg"/></div>
            <p id="loginErr" class="text-red-500 text-sm hidden">아이디 또는 비밀번호가 올바르지 않습니다.</p>
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg">로그인</button>
          </div>
        </div>
      </div>`;
    return;
  }
  if(state.user.role === 'admin') { renderAdmin(); } else { renderUser(); }
};

const renderUser = () => {
  const todayUsage = getTodayUsageCount();
  const maxUsage = 7;
  const remaining = maxUsage - todayUsage;
  
  document.getElementById('app').innerHTML = `
    <div class="p-4 max-w-4xl mx-auto">
      <div class="bg-white rounded-2xl shadow-xl p-6">
        <div class="flex justify-between items-start mb-4 flex-wrap gap-2">
          <div class="flex items-center gap-3"><span class="text-3xl">📝</span><h1 class="text-xl font-bold">일지 작성 도우미</h1></div>
          <div class="flex items-center gap-2"><span class="text-sm">${getGreeting()}</span><button onclick="logout()" class="px-3 py-1 bg-gray-100 rounded text-sm">🚪</button></div>
        </div>
        <div class="mb-6 p-4 bg-gradient-to-r from-indigo-50 via-blue-50 to-indigo-50 rounded-lg border border-indigo-100">
          <p class="text-sm text-gray-700 text-center">감사합니다 센터 선생님들의 업무부담을 줄여드리기 위해 개발된 앱입니다.</p>
          <p class="text-sm text-gray-500 text-center mt-2">🙏 모든 선생님이 원활하게 사용하실 수 있도록, 하루 ${maxUsage}회 이내로 사용해 주시면 감사하겠습니다.</p>
          <p class="text-sm ${remaining <= 2 ? 'text-red-500 font-semibold' : 'text-indigo-500'} text-center mt-2">📊 오늘 사용: ${todayUsage}회 / ${maxUsage}회 (남은 횟수: ${remaining}회)</p>
          <p class="text-xs text-indigo-500 text-center mt-2">✦ 개발자: 천만석 ✦</p>
        </div>
        <div class="space-y-4">
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="block text-sm font-semibold">활동내용 <span class="font-normal text-gray-500">(관찰내용과 특이사항을 자유롭게 입력)</span></label>
              <button onclick="showExample()" class="px-3 py-1 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded text-sm font-medium">📖 작성 예시</button>
            </div>
            <textarea id="activity" class="w-full px-4 py-3 border rounded-lg h-40" ${state.loading?'disabled':''}></textarea>
          </div>
          <div class="flex items-center gap-2"><input type="checkbox" id="needAction" class="w-5 h-5"><label for="needAction" class="text-sm">처리사항 포함</label></div>
          <button onclick="generate()" class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-semibold py-4 rounded-lg" ${state.loading || remaining <= 0?'disabled':''}>${state.loading?'⏳ 작성 중...':(remaining <= 0?'⚠️ 오늘 사용량 초과':'관찰일지 작성하기')}</button>
        </div>
        <div id="result"></div>
      </div>
      <p class="text-center mt-6 text-sm text-gray-600">💙 감사합니다 주간활동센터</p>
    </div>`;
};

// ============ 관리자 페이지 ============

const getStats = () => {
  const today = new Date().toLocaleDateString('ko-KR');
  const users = state.users.filter(u => u.role === 'user');
  const todayLogs = state.logs.filter(l => l.date === today);
  const todayUsers = [...new Set(todayLogs.map(l => l.user_id))];
  
  return {
    totalUsers: users.length,
    todayActiveUsers: todayUsers.length,
    todayConversions: todayLogs.length
  };
};

const getFilteredLogs = () => {
  let logs = [...state.logs];
  
  // 시작 날짜 필터
  if (state.logFilter.startDate) {
    logs = logs.filter(l => {
      const parts = l.date.split('. ').map(p => parseInt(p));
      if (parts.length >= 3) {
        const logDate = new Date(parts[0], parts[1] - 1, parts[2]);
        const startDate = new Date(state.logFilter.startDate);
        startDate.setHours(0, 0, 0, 0);
        return logDate >= startDate;
      }
      return true;
    });
  }
  
  // 끝 날짜 필터
  if (state.logFilter.endDate) {
    logs = logs.filter(l => {
      const parts = l.date.split('. ').map(p => parseInt(p));
      if (parts.length >= 3) {
        const logDate = new Date(parts[0], parts[1] - 1, parts[2]);
        const endDate = new Date(state.logFilter.endDate);
        endDate.setHours(23, 59, 59, 999);
        return logDate <= endDate;
      }
      return true;
    });
  }
  
  // 제공인력 필터
  if (state.logFilter.userId) {
    logs = logs.filter(l => l.user_id === state.logFilter.userId);
  }
  
  // 소속기관 필터
  if (state.logFilter.organization) {
    const usersInOrg = state.users.filter(u => u.organization === state.logFilter.organization).map(u => u.id);
    logs = logs.filter(l => usersInOrg.includes(l.user_id));
  }
  
  return logs;
};

const getFilteredUsers = () => {
  let users = state.users.filter(u => u.role === 'user');
  
  // 검색어 필터 (이름 또는 아이디)
  if (state.userFilter.search) {
    const search = state.userFilter.search.toLowerCase();
    users = users.filter(u => 
      u.name.toLowerCase().includes(search) || 
      u.id.toLowerCase().includes(search)
    );
  }
  
  // 소속기관 필터
  if (state.userFilter.organization) {
    users = users.filter(u => u.organization === state.userFilter.organization);
  }
  
  return users;
};

const getUniqueOrganizations = () => {
  const orgs = state.users.filter(u => u.organization).map(u => u.organization);
  return [...new Set(orgs)];
};

const renderAdmin = () => {
  const stats = getStats();
  const users = state.users.filter(u => u.role === 'user');
  const filteredLogs = getFilteredLogs();
  const filteredUsers = getFilteredUsers();
  const organizations = getUniqueOrganizations();
  
  document.getElementById('app').innerHTML = `
    <div class="p-4 max-w-6xl mx-auto">
      <div class="bg-white rounded-2xl shadow-xl p-6">
        <!-- 헤더 -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-2">
          <div class="flex items-center gap-3">
            <span class="text-3xl">📝</span>
            <div>
              <h1 class="text-xl font-bold">관리자 페이지</h1>
              <p class="text-sm text-gray-500">${state.user.name}님</p>
            </div>
          </div>
          <button onclick="logout()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg">🚪 로그아웃</button>
        </div>
        
        <!-- 탭 메뉴 -->
        <div class="flex gap-2 mb-6 flex-wrap border-b pb-4">
          <button onclick="state.tab='dashboard';render()" class="px-4 py-2 rounded-lg font-medium ${state.tab==='dashboard'?'bg-indigo-600 text-white':'bg-gray-100 hover:bg-gray-200'}">📊 대시보드</button>
          <button onclick="state.tab='logs';render()" class="px-4 py-2 rounded-lg font-medium ${state.tab==='logs'?'bg-indigo-600 text-white':'bg-gray-100 hover:bg-gray-200'}">📋 로그 관리</button>
          <button onclick="state.tab='users';render()" class="px-4 py-2 rounded-lg font-medium ${state.tab==='users'?'bg-indigo-600 text-white':'bg-gray-100 hover:bg-gray-200'}">👥 제공인력 관리</button>
        </div>
        
        <!-- 탭 컨텐츠 -->
        ${state.tab === 'dashboard' ? renderDashboard(stats, users) : ''}
        ${state.tab === 'logs' ? renderLogs(filteredLogs, users, organizations) : ''}
        ${state.tab === 'users' ? renderUsers(filteredUsers, organizations) : ''}
      </div>
    </div>`;
};

const renderDashboard = (stats, users) => {
  const today = new Date().toLocaleDateString('ko-KR');
  const todayLogs = state.logs.filter(l => l.date === today);
  
  const userUsage = users.map(u => ({
    name: u.name,
    count: todayLogs.filter(l => l.user_id === u.id).length
  })).filter(u => u.count > 0).sort((a, b) => b.count - a.count);
  
  return `
    <div class="space-y-6">
      <h2 class="text-lg font-bold">📊 통계 현황</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl p-6 border border-blue-200">
          <div class="flex items-center gap-3">
            <span class="text-3xl">👥</span>
            <div>
              <p class="text-sm text-blue-600">전체 제공인력</p>
              <p class="text-3xl font-bold text-blue-800">${stats.totalUsers}명</p>
            </div>
          </div>
        </div>
        <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-xl p-6 border border-green-200">
          <div class="flex items-center gap-3">
            <span class="text-3xl">🟢</span>
            <div>
              <p class="text-sm text-green-600">금일 접속자</p>
              <p class="text-3xl font-bold text-green-800">${stats.todayActiveUsers}명</p>
            </div>
          </div>
        </div>
        <div class="bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl p-6 border border-purple-200">
          <div class="flex items-center gap-3">
            <span class="text-3xl">📝</span>
            <div>
              <p class="text-sm text-purple-600">금일 변환 횟수</p>
              <p class="text-3xl font-bold text-purple-800">${stats.todayConversions}회</p>
            </div>
          </div>
        </div>
      </div>
      
      <div class="bg-gray-50 rounded-xl p-4">
        <h3 class="font-semibold mb-3">📈 금일 사용 현황</h3>
        ${userUsage.length > 0 ? `
          <div class="space-y-2">
            ${userUsage.map(u => `
              <div class="flex items-center gap-3 bg-white p-3 rounded-lg">
                <span class="font-medium w-24">${u.name}</span>
                <div class="flex-1 bg-gray-200 rounded-full h-4">
                  <div class="bg-indigo-500 h-4 rounded-full" style="width: ${Math.min(u.count / 7 * 100, 100)}%"></div>
                </div>
                <span class="text-sm font-semibold w-16 text-right">${u.count}회 / 7회</span>
              </div>
            `).join('')}
          </div>
        ` : '<p class="text-gray-500 text-center py-4">오늘 사용 기록이 없습니다.</p>'}
      </div>
    </div>
  `;
};

const renderLogs = (filteredLogs, users, organizations) => {
  return `
    <div class="space-y-4">
      <div class="flex justify-between items-center flex-wrap gap-2">
        <h2 class="text-lg font-bold">📋 로그 관리 (${filteredLogs.length}건)</h2>
        <button onclick="loadData()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm">🔄 새로고침</button>
      </div>
      
      <!-- 필터 -->
      <div class="bg-gray-50 rounded-lg p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-3">
          <div>
            <label class="block text-sm font-medium mb-1">시작 날짜</label>
            <input type="date" id="filterStartDate" value="${state.logFilter.startDate}" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">끝 날짜</label>
            <input type="date" id="filterEndDate" value="${state.logFilter.endDate}" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">소속기관</label>
            <select id="filterOrg" class="w-full px-3 py-2 border rounded-lg">
              <option value="">전체</option>
              ${organizations.map(o => `<option value="${o}" ${state.logFilter.organization===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1">제공인력</label>
            <select id="filterUser" class="w-full px-3 py-2 border rounded-lg">
              <option value="">전체</option>
              ${users.map(u => `<option value="${u.id}" ${state.logFilter.userId===u.id?'selected':''}>${u.name} (${u.organization || '-'})</option>`).join('')}
            </select>
          </div>
          <div class="flex items-end gap-2">
            <button onclick="searchLogs()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">🔍 검색</button>
            <button onclick="resetLogFilter()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm">초기화</button>
          </div>
        </div>
        ${state.selectedLogs.length > 0 ? `
          <div class="mt-3 pt-3 border-t">
            <button onclick="deleteSelectedLogs()" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm">🗑️ 선택 삭제 (${state.selectedLogs.length})</button>
          </div>
        ` : ''}
      </div>
      
      <!-- 로그 목록 -->
      <div class="space-y-3">
        ${filteredLogs.slice(0, 50).map(l => {
          const user = state.users.find(u => u.id === l.user_id);
          return `
          <div class="bg-gray-50 border rounded-lg p-4">
            <div class="flex items-start gap-3">
              <input type="checkbox" class="mt-1 w-4 h-4" ${state.selectedLogs.includes(l.id)?'checked':''} onchange="toggleLogSelect(${l.id})">
              <div class="flex-1">
                <div class="flex flex-wrap gap-2 text-sm mb-2">
                  <span class="text-indigo-600 font-medium">${l.date}</span>
                  <span class="text-gray-500">${l.time}</span>
                  <span class="bg-indigo-100 text-indigo-700 px-2 rounded">${l.user_name}</span>
                  <span class="bg-gray-200 text-gray-600 px-2 rounded text-xs">${user?.organization || '-'}</span>
                </div>
                <div class="space-y-2 text-sm">
                  <div>
                    <p class="text-xs text-gray-500">입력</p>
                    <p class="bg-white p-2 rounded border mt-1">${l.input || ''}</p>
                  </div>
                  <div>
                    <p class="text-xs text-green-600">관찰일지</p>
                    <p class="bg-white p-2 rounded border border-green-200 mt-1">${l.observation || ''}</p>
                  </div>
                  ${l.action ? `
                    <div>
                      <p class="text-xs text-orange-600">처리사항</p>
                      <p class="bg-white p-2 rounded border border-orange-200 mt-1">${l.action}</p>
                    </div>
                  ` : ''}
                </div>
              </div>
              <button onclick="deleteLog(${l.id})" class="text-red-500 hover:text-red-700 text-sm">🗑️</button>
            </div>
          </div>
        `}).join('')}
        ${filteredLogs.length === 0 ? '<p class="text-center py-8 text-gray-500">로그가 없습니다.</p>' : ''}
        ${filteredLogs.length > 50 ? `<p class="text-center py-4 text-gray-500">최근 50건만 표시됩니다.</p>` : ''}
      </div>
    </div>
  `;
};

// ============ API 호출 함수들 ============

const login = () => {
  const id = document.getElementById('loginId').value;
  const pw = document.getElementById('loginPw').value;
  const user = state.users.find(u => u.id === id && u.password === pw);
  
  if(user) {
    // 관리자는 만료일 체크 안함
    if(user.role !== 'admin') {
      // 구독만료일 체크
      if(user.subscription_end) {
        const expireDate = new Date(user.subscription_end);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        if(expireDate < today) {
          alert('😢 구독이 만료되었습니다.\n\n구독 연장을 원하시면 관리자에게 문의해주세요.');
          return;
        }
      }
    }
    
    state.user = user;
    render();
  } else {
    document.getElementById('loginErr').classList.remove('hidden');
  }
};;

const logout = () => { 
  state.user = null; 
  state.tab = 'dashboard';
  state.logFilter = { startDate: '', endDate: '', userId: '', organization: '' };
  state.userFilter = { search: '', organization: '' };
  state.selectedLogs = [];
  render(); 
};

let lastActivity = '';
let lastNeedAction = false;

const generate = async () => {
  const activity = document.getElementById('activity').value;
  const needAction = document.getElementById('needAction').checked;
  if(!activity) return alert('활동내용을 입력해주세요.');
  
  const todayUsage = getTodayUsageCount();
  if(todayUsage >= 7) {
    alert('😊 오늘 사용 가능한 횟수(7회)를 모두 사용하셨습니다.\n\n내일 다시 이용해 주시면 감사하겠습니다.\n선생님의 노고에 항상 감사드립니다! 🙏');
    return;
  }
  
  lastActivity = activity;
  lastNeedAction = needAction;
  state.loading = true; 
  render();
  document.getElementById('activity').value = activity;
  document.getElementById('needAction').checked = needAction;
  
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({activity, needAction})
    });
    const data = await res.json();
    if(data.error) {
      showResult('⚠️ ' + data.error, '', '');
      state.loading = false;
      render();
      return;
    }
    
    let obs = data.result || '', act = '';
    if(data.result.includes('[관찰일지]') && data.result.includes('[처리사항]')) {
      obs = (data.result.match(/\[관찰일지\]\s*([\s\S]*?)\s*\[처리사항]/) || [])[1]?.trim() || '';
      act = (data.result.match(/\[처리사항\]\s*([\s\S]*)$/) || [])[1]?.trim() || '';
    } else if(data.result.includes('[관찰일지]')) {
      obs = data.result.replace('[관찰일지]', '').trim();
    }
    
    const logData = {
      id: Date.now(),
      date: new Date().toLocaleDateString('ko-KR'),
      time: new Date().toLocaleTimeString('ko-KR'),
      user_id: state.user.id,
      user_name: state.user.name,
      input: activity,
      observation: obs,
      action: act
    };
    await api('addLog', logData);
    state.logs.unshift(logData);
    showResult('', obs, act);
  } catch(e) {
    showResult('⚠️ 네트워크 오류: ' + e.message, '', '');
  }
  
  state.loading = false; 
  render();
  document.getElementById('activity').value = lastActivity;
  document.getElementById('needAction').checked = lastNeedAction;
};

const regenerate = () => {
  if(!lastActivity) return alert('이전 입력 내용이 없습니다.');
  document.getElementById('activity').value = lastActivity;
  document.getElementById('needAction').checked = lastNeedAction;
  generate();
};

const showResult = (err, obs, act) => {
  setTimeout(() => {
    const r = document.getElementById('result');
    if(!r) return;
    
    if(err) {
      r.innerHTML = `<div class="mt-6 bg-red-50 border-2 border-red-300 rounded-lg p-4 text-red-800">${err}</div>`;
      return;
    }
    
    // 결과를 전역 변수에 저장
    window.lastObservation = obs;
    window.lastAction = act;
    
    r.innerHTML = `
      <div class="mt-6 space-y-4">
        <div class="bg-white rounded-lg p-4 border-2 border-green-200">
          <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold">관찰일지</h3>
            <button onclick="copyObservation(this)" class="px-3 py-1 bg-green-100 text-green-700 rounded text-sm">📋복사</button>
          </div>
          <div class="bg-gray-50 p-3 rounded border">${obs}</div>
        </div>
        ${act ? `
          <div class="bg-white rounded-lg p-4 border-2 border-orange-200">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold">처리사항</h3>
              <button onclick="copyAction(this)" class="px-3 py-1 bg-orange-100 text-orange-700 rounded text-sm">📋복사</button>
            </div>
            <div class="bg-gray-50 p-3 rounded border">${act}</div>
          </div>
        ` : ''}
        <div class="flex justify-center pt-4">
          <button onclick="regenerate()" class="px-6 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-lg font-semibold">다시 작성하기</button>
        </div>
      </div>`;
  }, 100);
};

const copyText = async(t, btn) => {
  try {
    await navigator.clipboard.writeText(t);
    if(btn) {
      btn.textContent = '✅복사됨';
      setTimeout(() => btn.textContent = '📋복사', 2000);
    }
  } catch {
    alert('복사실패');
  }
};

const copyObservation = async(btn) => {
  try {
    await navigator.clipboard.writeText(window.lastObservation || '');
    if(btn) {
      btn.textContent = '✅복사됨';
      setTimeout(() => btn.textContent = '📋복사', 2000);
    }
  } catch {
    alert('복사실패');
  }
};

const copyAction = async(btn) => {
  try {
    await navigator.clipboard.writeText(window.lastAction || '');
    if(btn) {
      btn.textContent = '✅복사됨';
      setTimeout(() => btn.textContent = '📋복사', 2000);
    }
  } catch {
    alert('복사실패');
  }
};
  
const addUser = async() => {
  const id = document.getElementById('modalUserId').value;
  const pw = document.getElementById('modalUserPw').value;
  const name = document.getElementById('modalUserName').value;
  const org = document.getElementById('modalUserOrg').value || '감사합니다';
  const expire = document.getElementById('modalUserExpire').value || '2026-02-20';
  
  if(!id || !pw || !name) return alert('아이디, 비밀번호, 이름은 필수입니다.');
  if(state.users.find(u => u.id === id)) return alert('이미 존재하는 아이디입니다.');
  
  await api('addUser', { id, password: pw, name, role: 'user', organization: org, subscription_end: expire });
  state.users.push({ id, password: pw, name, role: 'user', organization: org, subscription_end: expire });
  closeUserModal();
  render();
};

const updateUser = async() => {
  const id = state.editingUser.id;
  const pw = document.getElementById('modalUserPw').value;
  const name = document.getElementById('modalUserName').value;
  const org = document.getElementById('modalUserOrg').value;
  const expire = document.getElementById('modalUserExpire').value;
  
  await api('updateUser', { id, password: pw, name, organization: org, subscription_end: expire });
  
  const user = state.users.find(u => u.id === id);
  if(user) {
    if(pw) user.password = pw;
    if(name) user.name = name;
    if(org) user.organization = org;
    if(expire) user.subscription_end = expire;
  }
  
  closeUserModal();
  render();
};

const deleteUser = async(id) => {
  if(confirm(`'${id}' 사용자를 삭제하시겠습니까?`)) {
    await api('deleteUser', { id });
    state.users = state.users.filter(u => u.id !== id);
    render();
  }
};

// 사용량 초기화 (해당 사용자의 오늘 로그 삭제)
const resetUserUsage = async(userId, userName) => {
  if(confirm(`'${userName}' 선생님의 오늘 사용량을 초기화하시겠습니까?\n\n⚠️ 오늘 작성한 로그가 모두 삭제됩니다.`)) {
    const today = new Date().toLocaleDateString('ko-KR');
    const todayLogs = state.logs.filter(l => l.user_id === userId && l.date === today);
    const ids = todayLogs.map(l => l.id);
    
    if(ids.length > 0) {
      await api('deleteLogs', { ids });
      state.logs = state.logs.filter(l => !ids.includes(l.id));
    }
    
    alert(`${userName} 선생님의 오늘 사용량이 초기화되었습니다.`);
    render();
  }
};

const toggleLogSelect = (id) => {
  if(state.selectedLogs.includes(id)) {
    state.selectedLogs = state.selectedLogs.filter(l => l !== id);
  } else {
    state.selectedLogs.push(id);
  }
  render();
};

const deleteLog = async(id) => {
  if(confirm('이 로그를 삭제하시겠습니까?')) {
    await api('deleteLog', { id });
    state.logs = state.logs.filter(l => l.id !== id);
    render();
  }
};

const deleteSelectedLogs = async() => {
  if(confirm(`선택한 ${state.selectedLogs.length}개의 로그를 삭제하시겠습니까?`)) {
    await api('deleteLogs', { ids: state.selectedLogs });
    state.logs = state.logs.filter(l => !state.selectedLogs.includes(l.id));
    state.selectedLogs = [];
    render();
  }
};

loadData();
</script>
