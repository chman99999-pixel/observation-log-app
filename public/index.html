<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복지인 서류해방</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-fade { 0%,100% { opacity:.4; transform:scale(.85); } 50% { opacity:1; transform:scale(1); } }
    .splash-spinner { width:48px; height:48px; border:4px solid #c7d2fe; border-top-color:#6366f1; border-radius:50%; animation:spin .9s linear infinite; }
    .splash-dot { width:10px; height:10px; border-radius:50%; background:#6366f1; animation:pulse-fade 1.2s ease-in-out infinite; }
    .splash-dot:nth-child(2) { animation-delay:.2s; }
    .splash-dot:nth-child(3) { animation-delay:.4s; }
    /* 브랜드 카드 캐러셀 (수평 슬라이드) */
    @keyframes slide-left-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes slide-left-out { from { transform: translateX(0); } to { transform: translateX(-100%); } }
    .brand-slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 1.5rem; }
    .brand-slide[data-state="entering"] { animation: slide-left-in .5s cubic-bezier(.4,0,.2,1) forwards; }
    .brand-slide[data-state="leaving"] { animation: slide-left-out .5s cubic-bezier(.4,0,.2,1) forwards; }
    .brand-slide[data-state="hidden"] { transform: translateX(100%); opacity:0; pointer-events:none; }
    .brand-slide[data-state="visible"] { transform: translateX(0); opacity:1; }

    /* 랜딩 페이지 애니메이션 */
    @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeInDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes scaleIn { from { opacity:0; transform:scale(.85); } to { opacity:1; transform:scale(1); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
    @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
    @keyframes countUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .land-fadeUp { animation: fadeInUp .7s ease-out both; }
    .land-fadeDown { animation: fadeInDown .6s ease-out both; }
    .land-scaleIn { animation: scaleIn .6s ease-out both; }
    .land-float { animation: float 3s ease-in-out infinite; }
    .land-delay-1 { animation-delay: .15s; }
    .land-delay-2 { animation-delay: .3s; }
    .land-delay-3 { animation-delay: .45s; }
    .land-delay-4 { animation-delay: .6s; }
    .land-delay-5 { animation-delay: .75s; }
    .land-shimmer { background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.4) 50%, transparent 100%); background-size: 200% 100%; animation: shimmer 2.5s infinite; }
    .land-stat { animation: countUp .5s ease-out both; }
    .land-glass { background: rgba(255,255,255,.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50">

<script>
let state = {
  user: null,
  users: [],
  logs: [],
  loading: false,
  tab: 'dashboard',
  page: 'landing',  // 'landing' | 'login' | 'app'
  dataLoaded: false,
  logFilter: { startDate: '', endDate: '', userId: '', organization: '' },
  userFilter: { search: '', organization: '' },
  selectedLogs: [],
  editingUser: null,
  appConfig: null,
  aiModel: 'haiku'
};

let authToken = sessionStorage.getItem('authToken') || null;

const api = async (action, body = null) => {
  const headers = { 'Content-Type': 'application/json' };
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
  const res = await fetch(`/api/db?action=${action}`, {
    method: body ? 'POST' : 'GET',
    headers,
    body: body ? JSON.stringify(body) : null
  });
  return res.json();
};

const loadData = async () => {
  try {
    const [users, logs, cfg, settings] = await Promise.all([
      api('getUsers'),
      api('getLogs'),
      fetch('/api/getAppConfig').then(r => r.json()).catch(() => ({})),
      api('getSettings').catch(() => [])
    ]);
    state.users = users;
    state.logs = logs;
    state.appConfig = cfg;
    const aiModelSetting = settings.find(s => s.key === 'ai_model');
    if (aiModelSetting) state.aiModel = aiModelSetting.value;
    state.dataLoaded = true;
  } catch (e) { console.error(e); state.users = []; state.logs = []; state.dataLoaded = true; }
  // render()는 외부(스플래시 타이머)에서 호출
};

const openExtApp = (url) => {
  const code = state.appConfig?.accessCode ?? '';
  window.open(url + '?ac=' + encodeURIComponent(code), '_blank');
};

// 로그 검색
const searchLogs = () => {
  state.logFilter.startDate = document.getElementById('filterStartDate').value;
  state.logFilter.endDate = document.getElementById('filterEndDate').value;
  state.logFilter.organization = document.getElementById('filterOrg').value;
  state.logFilter.userId = document.getElementById('filterUser').value;
  render();
};

// 로그 필터 초기화
const resetLogFilter = () => {
  state.logFilter = { startDate: '', endDate: '', userId: '', organization: '' };
  render();
};

// 제공인력 검색
const searchUsers = () => {
  state.userFilter.search = document.getElementById('userSearchInput').value;
  state.userFilter.organization = document.getElementById('userOrgFilter').value;
  render();
};

// 제공인력 필터 초기화
const resetUserFilter = () => {
  state.userFilter = { search: '', organization: '' };
  render();
};

const getGreeting = () => {
  const h = new Date().getHours(), n = state.user.name;
  if(h>=6&&h<12) return `좋은 아침이에요, ${n} 선생님 ☀️`;
  if(h>=12&&h<18) return `오늘도 힘내세요, ${n} 선생님 💪`;
  if(h>=18&&h<22) return `오늘 하루도 수고하셨어요, ${n} 선생님 🌙`;
  return `늦은 밤 고생이 많으세요, ${n} 선생님 🌜`;
};

};

const getStats = () => {
  const today = new Date().toLocaleDateString('ko-KR');
  const users = state.users.filter(u => u.role === 'user');
  const todayLogs = state.logs.filter(l => l.date === today);
  const todayUsers = [...new Set(todayLogs.map(l => l.user_id))];
  
  return {
    totalUsers: users.length,
    todayActiveUsers: todayUsers.length,
    todayConversions: todayLogs.length
  };
};

const getFilteredLogs = () => {
  let logs = [...state.logs];
  
  // 시작 날짜 필터
  if (state.logFilter.startDate) {
    logs = logs.filter(l => {
      const parts = l.date.split('. ').map(p => parseInt(p));
      if (parts.length >= 3) {
        const logDate = new Date(parts[0], parts[1] - 1, parts[2]);
        const startDate = new Date(state.logFilter.startDate);
        startDate.setHours(0, 0, 0, 0);
        return logDate >= startDate;
      }
      return true;
    });
  }
  
  // 끝 날짜 필터
  if (state.logFilter.endDate) {
    logs = logs.filter(l => {
      const parts = l.date.split('. ').map(p => parseInt(p));
      if (parts.length >= 3) {
        const logDate = new Date(parts[0], parts[1] - 1, parts[2]);
        const endDate = new Date(state.logFilter.endDate);
        endDate.setHours(23, 59, 59, 999);
        return logDate <= endDate;
      }
      return true;
    });
  }
  
  // 제공인력 필터
  if (state.logFilter.userId) {
    logs = logs.filter(l => l.user_id === state.logFilter.userId);
  }
  
  // 소속기관 필터
  if (state.logFilter.organization) {
    const usersInOrg = state.users.filter(u => u.organization === state.logFilter.organization).map(u => u.id);
    logs = logs.filter(l => usersInOrg.includes(l.user_id));
  }
  
  return logs;
};

const getFilteredUsers = () => {
  let users = [...state.users];
  
  // 검색어 필터 (이름 또는 아이디)
  if (state.userFilter.search) {
    const search = state.userFilter.search.toLowerCase();
    users = users.filter(u => 
      u.name.toLowerCase().includes(search) || 
      u.id.toLowerCase().includes(search)
    );
  }
  
  // 소속기관 필터
  if (state.userFilter.organization) {
    users = users.filter(u => u.organization === state.userFilter.organization);
  }
  
  return users;
};

const getUniqueOrganizations = () => {
  const orgs = state.users.filter(u => u.organization).map(u => u.organization);
  return [...new Set(orgs)];
};

const getSubscriptionDaysLeft = (user) => {
  if (!user || !user.subscription_end) return null;
  const expire = new Date(user.subscription_end);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  expire.setHours(0, 0, 0, 0);
  return Math.ceil((expire - today) / (1000 * 60 * 60 * 24));
};

const login = async () => {
  const id = document.getElementById('loginId').value;
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginErr');

  if (!id || !pw) { errEl.classList.remove('hidden'); return; }

  try {
    const res = await fetch('/api/auth?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, password: pw })
    });
    const data = await res.json();

    if (!res.ok) {
      if (data.error === 'subscription_expired') {
        alert('😢 구독이 만료되었습니다.\n\n구독 연장을 원하시면 관리자에게 문의해주세요.');
        return;
      }
      errEl.classList.remove('hidden');
      return;
    }

    authToken = data.token;
    sessionStorage.setItem('authToken', authToken);
    state.user = data.user;
    state.page = 'app';
    state.tab = 'hub';
    render();

    // 구독 만료 3일 전부터 알림 팝업
    const daysLeft = getSubscriptionDaysLeft(data.user);
    if (daysLeft !== null && daysLeft <= 3) {
      setTimeout(() => showSubscriptionAlert(daysLeft, data.user.subscription_end), 300);
    }
  } catch (e) {
    console.error('Login error:', e);
    errEl.classList.remove('hidden');
  }
};

const register = async () => {
  const id = document.getElementById('regId').value.trim();
  const pw = document.getElementById('regPw').value;
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const org = document.getElementById('regOrg').value.trim();
  const errEl = document.getElementById('regErr');

  if (!id || !pw || !name || !email) {
    errEl.textContent = '아이디, 비밀번호, 이름, 이메일은 필수입니다.';
    errEl.classList.remove('hidden');
    return;
  }

  if (!isValidEmail(email)) {
    errEl.textContent = '올바른 이메일 형식을 입력해주세요. (예: name@email.com)';
    errEl.classList.remove('hidden');

  }

  try {
    const res = await fetch('/api/auth?action=register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, password: pw, name, email, organization: org })
    });

    if (!res.ok) {
      errEl.textContent = data.error || '회원가입에 실패했습니다.';
      errEl.classList.remove('hidden');

let lastActivity = '';
let lastNeedAction = false;
let lastTone = 'default';
let lastCharCount = '140';
let lastIncludeExpertView = true;

const getSelectedOptions = () => {
  const toneEl = document.querySelector('input[name="tone"]:checked');
  const charEl = document.querySelector('input[name="charCount"]:checked');
  const expertEl = document.getElementById('includeExpertView');
  const customEl = document.getElementById('customCharCount');

  const tone = toneEl ? toneEl.value : 'default';
  let charCount = charEl ? charEl.value : '140';
  if (charCount === 'custom') charCount = customEl ? customEl.value || '140' : '140';
  const includeExpertView = expertEl ? expertEl.checked : true;

  return { tone, charCount, includeExpertView };
};

const restoreOptions = () => {
  const toneEl = document.querySelector(`input[name="tone"][value="${lastTone}"]`);
  if (toneEl) toneEl.checked = true;

  const isCustom = !['120','140','160'].includes(lastCharCount);
  const charVal = isCustom ? 'custom' : lastCharCount;
  const charEl = document.querySelector(`input[name="charCount"][value="${charVal}"]`);
  if (charEl) charEl.checked = true;

  const customEl = document.getElementById('customCharCount');
  if (customEl) {
    if (isCustom) { customEl.classList.remove('hidden'); customEl.value = lastCharCount; }
    else { customEl.classList.add('hidden'); }
  }

  const expertEl = document.getElementById('includeExpertView');
  if (expertEl) expertEl.checked = lastIncludeExpertView;
};

const generate = async () => {
  const activity = document.getElementById('activity').value;
  const needAction = document.getElementById('needAction').checked;
  if(!activity) return alert('활동내용을 입력해주세요.');

  const todayUsage = getTodayUsageCount();
  if(todayUsage >= 7) {
    alert('😊 오늘 사용 가능한 횟수(7회)를 모두 사용하셨습니다.\n\n내일 다시 이용해 주시면 감사하겠습니다.\n선생님의 노고에 항상 감사드립니다! 🙏');
    return;
  }

  const { tone, charCount, includeExpertView } = getSelectedOptions();
  lastActivity = activity;
  lastNeedAction = needAction;
  lastTone = tone;
  lastCharCount = charCount;
  lastIncludeExpertView = includeExpertView;
  state.loading = true;
  render();
  document.getElementById('activity').value = activity;
  document.getElementById('needAction').checked = needAction;
  restoreOptions();

  try {
    const genHeaders = {'Content-Type': 'application/json'};
    if (authToken) genHeaders['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: genHeaders,
      body: JSON.stringify({activity, needAction, model: state.aiModel, tone, charCount: parseInt(charCount), includeExpertView})
    });
    const data = await res.json();
    if(data.error) {
      showResult('⚠️ ' + data.error, '', '');
      state.loading = false;
      render();
      return;
    }
    
    let obs = data.result || '', act = '';
    if(data.result.includes('[관찰일지]') && data.result.includes('[처리사항]')) {
      obs = (data.result.match(/\[관찰일지\]\s*([\s\S]*?)\s*\[처리사항]/) || [])[1]?.trim() || '';
      act = (data.result.match(/\[처리사항\]\s*([\s\S]*)$/) || [])[1]?.trim() || '';
    } else if(data.result.includes('[관찰일지]')) {
      obs = data.result.replace('[관찰일지]', '').trim();
    }
    
    const logData = {
      id: Date.now(),
      date: new Date().toLocaleDateString('ko-KR'),
      time: new Date().toLocaleTimeString('ko-KR'),
      user_id: state.user.id,
      user_name: state.user.name,
      input: activity,
      observation: obs,
      action: act
    };
    await api('addLog', logData);
    state.logs.unshift(logData);
    showResult('', obs, act);
  } catch(e) {
    showResult('⚠️ 네트워크 오류: ' + e.message, '', '');
  }
  
  state.loading = false;
  render();
  document.getElementById('activity').value = lastActivity;
  document.getElementById('needAction').checked = lastNeedAction;
  restoreOptions();
};

const regenerate = () => {
  if(!lastActivity) return alert('이전 입력 내용이 없습니다.');
  document.getElementById('activity').value = lastActivity;
  document.getElementById('needAction').checked = lastNeedAction;
  restoreOptions();
  generate();
};

const showResult = (err, obs, act) => {
  setTimeout(() => {
    const r = document.getElementById('result');
    if(!r) return;
    
    if(err) {
      r.innerHTML = `<div class="mt-6 bg-red-50 border-2 border-red-300 rounded-lg p-4 text-red-800">${err}</div>`;
      return;
    }
    
    // 결과를 전역 변수에 저장
    window.lastObservation = obs;
    window.lastAction = act;
    
    r.innerHTML = `
      <div class="mt-6 space-y-4">
        <div class="bg-white rounded-lg p-4 border-2 border-green-200">
          <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold">관찰일지</h3>
            <button onclick="copyObservation(this)" class="px-3 py-1 bg-green-100 text-green-700 rounded text-sm">📋복사</button>
          </div>
          <div class="bg-gray-50 p-3 rounded border">${obs}</div>
        </div>
        ${act ? `
          <div class="bg-white rounded-lg p-4 border-2 border-orange-200">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold">처리사항</h3>
              <button onclick="copyAction(this)" class="px-3 py-1 bg-orange-100 text-orange-700 rounded text-sm">📋복사</button>
            </div>
            <div class="bg-gray-50 p-3 rounded border">${act}</div>
          </div>
        ` : ''}
        <div class="flex justify-center pt-4">
          <button onclick="regenerate()" class="px-6 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-lg font-semibold">다시 작성하기</button>
        </div>
      </div>`;
  }, 100);
};

    await api('deleteLogs', { ids: state.selectedLogs });
    state.logs = state.logs.filter(l => !state.selectedLogs.includes(l.id));
    state.selectedLogs = [];
    render();
  }
};

// 날짜 형식 변환: 'YYYY. M. D.' (ko-KR) → Date 객체
const parseKoreanDate = (dateStr) => {
  if (!dateStr) return null;
  const cleaned = dateStr.replace(/\./g, '').replace(/\s+/g, ' ').trim();
  const parts = cleaned.split(/[\s\-\/]+/);
  if (parts.length >= 3) {
    return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  }
  return new Date(dateStr);
};

// 30일 이전 로그 삭제
const deleteOldLogs = async() => {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  cutoff.setHours(0, 0, 0, 0);

  // 한국어 날짜 형식('2026. 2. 9.')과 비교
  const oldLogs = state.logs.filter(l => {
    const logDate = parseKoreanDate(l.date);
    return logDate && logDate < cutoff;
  });

  if (oldLogs.length === 0) {
    alert('30일 이전 로그가 없습니다.');
    return;
  }

  const cutoffDisplay = `${cutoff.getFullYear()}. ${cutoff.getMonth()+1}. ${cutoff.getDate()}.`;
  if(confirm(`⚠️ 30일 이전 로그 삭제\n\n${cutoffDisplay} 이전에 작성된 로그 ${oldLogs.length}건을 삭제합니다.\n\n삭제된 로그는 복구할 수 없습니다.\n계속하시겠습니까?`)) {
    try {
      const oldIds = oldLogs.map(l => l.id);
      await api('deleteLogs', { ids: oldIds });
      state.logs = state.logs.filter(l => !oldIds.includes(l.id));
      state.selectedLogs = [];
      render();
      alert(`✅ ${oldLogs.length}건의 로그가 삭제되었습니다.`);
    } catch(e) {
      alert('삭제 중 오류가 발생했습니다: ' + e.message);
    }
  }
};

// 브랜드 카드 캐러셀 (수평 슬라이드)
let _brandInterval = null;
const startBrandSlider = () => {
  if(_brandInterval) clearInterval(_brandInterval);
  let cur = 0;
  const slides = document.querySelectorAll('.brand-slide');
  const dots = document.querySelectorAll('#brand-dots span');
  if(!slides.length) return;
  const updateDots = (idx) => {
    dots.forEach((d,i) => {
      d.className = i === idx
        ? 'w-2 h-2 rounded-full bg-indigo-400 transition-all duration-300'
        : 'w-2 h-2 rounded-full bg-gray-300 transition-all duration-300';
    });
  };
  _brandInterval = setInterval(() => {
    const next = (cur + 1) % slides.length;
    slides[cur].setAttribute('data-state','leaving');
    slides[next].setAttribute('data-state','entering');
    updateDots(next);
    setTimeout(() => {
      slides[cur].setAttribute('data-state','hidden');
      slides[next].setAttribute('data-state','visible');
    }, 500);
    cur = next;
  }, 3500);
};

// 글자수 라디오 변경 시 커스텀 입력 토글 (이벤트 위임)
document.addEventListener('change', e => {
  if (e.target.name === 'charCount') {
    const el = document.getElementById('customCharCount');
    if (el) el.classList.toggle('hidden', e.target.value !== 'custom');
  }
});

// 스플래시 화면 최소 1.8초 보장 후 로그인 화면 전환
const _splashStart = Date.now();

const restoreSession = async () => {
  if (!authToken) return;
  try {
    const res = await fetch('/api/auth?action=verify', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    if (res.ok) {
      const data = await res.json();
      state.user = data.user;
      state.page = 'app';
      state.tab = 'hub';
    } else {
      authToken = null;
      sessionStorage.removeItem('authToken');
    }
  } catch {
    authToken = null;
    sessionStorage.removeItem('authToken');
  }
};

loadData().then(() => restoreSession()).then(() => {
  const elapsed = Date.now() - _splashStart;
  const minMs = 1800;
  setTimeout(render, Math.max(0, minMs - elapsed));
});
</script>
